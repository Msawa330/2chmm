<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2chmm要約リーダー</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="2chmmリーダー">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{--bg:#fafafa;--fg:#111;--dim:#6b7280;--line:#e5e7eb;--accent:#2563eb;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#111;--fg:#f3f4f6;--dim:#9ca3af;--line:#2a2a2a;--card:#1a1a1a}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip;background:var(--bg);color:var(--fg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
a{color:var(--accent);overflow-wrap:anywhere}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px}
header.top .ttl{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .upd{font-size:11px;color:var(--dim)}
header.top .rbtn{flex-shrink:0;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--dim);background:var(--card)}
header.top .rbtn:disabled{opacity:.55}
main{max-width:760px;margin:0 auto;padding:0 12px 40px}
.chips{display:flex;flex-wrap:nowrap;gap:6px;padding:10px 0 2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--dim);background:var(--card)}
.chip.on{background:#374151;color:#fff;border-color:#374151}
.blogsec{margin-top:14px}
.bloghead{display:flex;align-items:flex-end;gap:8px;border-bottom:3px solid var(--line);padding-bottom:4px}
.bloghead .bname{font-weight:700;font-size:15px;flex:1;min-width:0;overflow-wrap:anywhere}
.bloghead .more{color:var(--dim);font-size:13px;padding:2px 4px;flex-shrink:0}
.cat-news{border-bottom-color:#e0857c}.cat-game{border-bottom-color:#84a8d8}.cat-entertainment{border-bottom-color:#eda3c2}.cat-animal{border-bottom-color:#f0af72}.cat-other{border-bottom-color:#8fb573}
.row{display:block;width:100%;text-align:left;padding:9px 2px;border-bottom:1px solid var(--line)}
.row .rt{font-size:15px;overflow-wrap:anywhere}
.row .rm{font-size:11px;color:var(--dim);margin-top:2px}
.row.read .rt{color:var(--dim)}
.backbtn{display:block;width:100%;margin:18px 0 6px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-align:center;font-size:15px}
.empty{color:var(--dim);padding:24px 0;text-align:center}
/* article */
.articlewrap{background:#fff;color:#111;min-height:100vh}
.articlewrap .backbtn{background:#fff;color:#111;border-color:#d1d5db}
.articleinner{max-width:760px;margin:0 auto;padding:0 12px 48px}
.arthead{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 12px;display:flex;align-items:center;gap:8px}
.arthead .back{color:var(--accent);border:1px solid #d1d5db;border-radius:8px;padding:5px 10px;font-size:14px;flex-shrink:0}
.arthead .meta{flex:1;font-size:12px;color:#6b7280;min-width:0;overflow-wrap:anywhere}
.arthead .orig{border:1px solid #d1d5db;border-radius:8px;padding:5px 10px;font-size:14px;color:#111;flex-shrink:0;text-decoration:none}
h1.atitle{font-size:19px;line-height:1.45;margin:14px 0 4px;overflow-wrap:anywhere}
.adate{font-size:12px;color:#6b7280;margin-bottom:10px}
.post{padding:10px 0;border-bottom:1px solid #e5e7eb;overflow-wrap:anywhere;word-break:break-word}
.post img{max-width:100%;height:auto;display:block;margin:8px 0;border-radius:4px}
.post a{overflow-wrap:anywhere}
.cmtsec{margin-top:22px}
.cmtsec h2{font-size:15px;border-bottom:2px solid #111;padding-bottom:4px}
.cmt{padding:9px 0;border-bottom:1px solid #e5e7eb;white-space:pre-wrap;overflow-wrap:anywhere}
/* viewer */
#viewer{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);display:none;touch-action:none;overflow:hidden}
#viewer.open{display:block}
#viewer .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#viewer img{max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none;touch-action:none}
#viewer .vclose{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:2;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:8px 14px;font-size:15px}
#viewer .vctl{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:2}
#viewer .vctl button{background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:8px 16px;font-size:16px;min-width:52px}
</style>
</head>
<body>
<div id="app"></div>
<div id="viewer" aria-hidden="true">
  <button class="vclose" id="vClose">閉じる</button>
  <div class="stage" id="vStage"><img id="vImg" alt=""></div>
  <div class="vctl"><button id="vMinus">−</button><button id="vPct">100%</button><button id="vPlus">＋</button></div>
</div>
<script>
'use strict';
const $app = document.getElementById('app');
const state = { data: null, blog: null, article: null, read: new Set(JSON.parse(localStorage.getItem('readIds') || '[]')), hidden: new Set(JSON.parse(localStorage.getItem('hiddenBlogs') || '[]')) };
// スクロール位置は一覧ビューごとに独立して保持する（記事のスクロールとは混ざらない）
const scrollMemo = {};
function listKey() { return state.blog ? 'blog:' + state.blog : 'top'; }
function saveListScroll() { if (!state.article) scrollMemo[listKey()] = window.scrollY; }
function restoreListScroll() { restoreScrollSticky(scrollMemo[listKey()] || 0); }
// 画面遷移の直後は、記事側の慣性スクロール等で保存済みの位置が上書きされないよう記録を止める。
// 復元は1回で効かないことがあるため、位置が合うまで数回かけ直す（ユーザーが触ったら中止）。
let navLockUntil = 0;
let stickyRestore = null;
function cancelStickyRestore() { if (stickyRestore) { clearTimeout(stickyRestore.timer); stickyRestore = null; } }
function lockNav() { navLockUntil = Date.now() + 450; cancelStickyRestore(); }
function restoreScrollSticky(y) {
  cancelStickyRestore();
  const apply = () => {
    window.scrollTo(0, y);
    if (Math.abs(window.scrollY - y) <= 2) { stickyRestore = null; return; }
    if (stickyRestore && stickyRestore.tries > 0) {
      stickyRestore.tries--;
      stickyRestore.timer = setTimeout(() => requestAnimationFrame(apply), 60);
    } else stickyRestore = null;
  };
  stickyRestore = { tries: 6, timer: 0 };
  requestAnimationFrame(apply);
}
window.addEventListener('touchstart', cancelStickyRestore, { passive: true });
window.addEventListener('wheel', cancelStickyRestore, { passive: true });
// 記事内のリンク（動画など）へ飛んだあと閉じると、画面が再読み込みされて一覧に戻ってしまうことがある。
// 表示中の記事・絞り込み・スクロール位置を保存しておき、再読み込み時は30分以内なら元の記事と位置へ復帰する。
const VIEW_KEY = 'viewStateV1';
let articleScrollY = 0;
let viewSaveAt = 0;
function saveView() {
  try {
    localStorage.setItem(VIEW_KEY, JSON.stringify({ t: Date.now(), blog: state.blog, articleId: state.article ? state.article.meta.id : null, articleScrollY, memo: scrollMemo }));
  } catch { /* ignore */ }
}
function scheduleSaveView() {
  const now = Date.now();
  if (now - viewSaveAt < 300) return;
  viewSaveAt = now;
  saveView();
}
window.addEventListener('scroll', () => {
  if (Date.now() < navLockUntil) return; // 遷移直後は慣性スクロールで保存位置を上書きしない
  if (state.article) articleScrollY = window.scrollY; else scrollMemo[listKey()] = window.scrollY;
  scheduleSaveView();
}, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveView(); });
window.addEventListener('pagehide', saveView);
function restoreView() {
  try {
    const v = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null');
    if (v && Date.now() - v.t <= 30 * 60 * 1000) {
      if (v.memo) Object.assign(scrollMemo, v.memo);
      if (v.blog && blogByKey(v.blog)) state.blog = v.blog;
      if (v.articleId) {
        const meta = state.data.articles.find(a => a.id === v.articleId);
        if (meta) {
          const lk = v.blog ? 'blog:' + v.blog : 'top';
          openArticle(v.articleId, v.articleScrollY || 0, (v.memo && v.memo[lk]) || 0);
          return;
        }
      }
      render();
      restoreListScroll();
      return;
    }
  } catch { /* ignore */ }
  render();
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function relTime(ts) {
  if (!ts) return '';
  const d = Date.now() - ts;
  if (d < 60 * 1000) return 'たった今';
  if (d < 3600 * 1000) return Math.floor(d / 60000) + '分前';
  if (d < 86400 * 1000) return Math.floor(d / 3600000) + '時間前';
  return Math.floor(d / 86400000) + '日前';
}
function fmtDT(ts) {
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function saveRead() { localStorage.setItem('readIds', JSON.stringify([...state.read].slice(-800))); }
function blogByKey(k) { return state.data.blogs.find(b => b.key === k); }
function artsOf(k) { return state.data.articles.filter(a => a.blogKey === k); }

function render() {
  if (state.article) return renderArticle();
  if (state.blog) return renderBlog();
  renderTop();
}
let refreshing = false;
function headerHTML() {
  const g = state.data.generatedAt ? new Date(state.data.generatedAt) : null;
  const upd = g ? ('データ: ' + (g.getMonth() + 1) + '/' + g.getDate() + ' ' + String(g.getHours()).padStart(2, '0') + ':' + String(g.getMinutes()).padStart(2, '0')) : '';
  return '<header class="top"><div class="ttl">2chmm要約リーダー</div><div class="upd">' + esc(upd) + '</div><button class="rbtn" id="reloadBtn"' + (refreshing ? ' disabled' : '') + '>' + (refreshing ? '読み込み中…' : '再読み込み') + '</button></header>';
}
function bindHeader() {
  const rb = document.getElementById('reloadBtn');
  if (rb) rb.addEventListener('click', refreshData);
}
// ヘッダーの再読み込み：最新の一覧データを取り直して、その場で表示を更新する（位置は保つ）
async function refreshData() {
  if (refreshing) return;
  refreshing = true;
  const y0 = window.scrollY;
  if (!state.article) { render(); restoreScrollSticky(y0); }
  try {
    const res = await fetch('data/index.json', { cache: 'no-cache' });
    try { const cache = await caches.open('data-2chmm'); cache.put('data/index.json', res.clone()); } catch { /* ignore */ }
    state.data = await res.json();
  } catch { /* オフライン時は何もしない */ }
  refreshing = false;
  if (!state.article) { const y = window.scrollY; render(); restoreScrollSticky(y); }
}
function chipsHTML() {
  let h = '<div class="chips"><button class="chip' + (!state.blog ? ' on' : '') + '" data-blog="">すべて</button>';
  for (const b of state.data.blogs) {
    if (state.hidden.has(b.key)) continue;
    h += '<button class="chip' + (state.blog === b.key ? ' on' : '') + '" data-blog="' + b.key + '">' + esc(b.name) + '</button>';
  }
  return h + '</div>';
}
function rowHTML(a) {
  return '<button class="row' + (state.read.has(a.id) ? ' read' : '') + '" data-art="' + a.id + '"><div class="rt">' + esc(a.title) + '</div>' +
    (a.publishedAt ? '<div class="rm">' + esc(relTime(a.publishedAt)) + '</div>' : '') + '</button>';
}
function renderTop() {
  let h = headerHTML() + '<main>' + chipsHTML();
  const blogs = state.data.blogs.filter(b => !state.hidden.has(b.key));
  for (const b of blogs) {
    const arts = artsOf(b.key).slice(0, 5);
    if (!arts.length) continue;
    h += '<section class="blogsec"><div class="bloghead cat-' + esc(b.category) + '"><div class="bname">' + esc(b.name) + '</div><button class="more" data-more="' + b.key + '">もっと見る</button></div>';
    for (const a of arts) h += rowHTML(a);
    h += '</section>';
  }
  h += '</main>';
  $app.innerHTML = h;
  bindList();
  bindHeader();
}
function renderBlog() {
  const b = blogByKey(state.blog);
  const arts = artsOf(state.blog);
  let h = headerHTML() + '<main>' + chipsHTML();
  h += '<section class="blogsec"><div class="bloghead cat-' + esc(b.category) + '"><div class="bname">' + esc(b.name) + '</div><button class="more" data-clear="1">戻る</button></div>';
  if (!arts.length) h += '<div class="empty">記事がありません</div>';
  for (const a of arts) h += rowHTML(a);
  h += '</section><button class="backbtn" data-clear="1">← 一覧に戻る</button></main>';
  $app.innerHTML = h;
  bindList();
  bindHeader();
}
let lastNavAt = 0;
function bindList() {
  $app.querySelectorAll('[data-blog]').forEach(el => el.addEventListener('click', () => { lastNavAt = Date.now(); saveListScroll(); lockNav(); state.blog = el.dataset.blog || null; render(); restoreListScroll(); saveView(); }));
  $app.querySelectorAll('[data-more]').forEach(el => el.addEventListener('click', () => { lastNavAt = Date.now(); saveListScroll(); lockNav(); state.blog = el.dataset.more; render(); restoreListScroll(); saveView(); }));
  $app.querySelectorAll('[data-clear]').forEach(el => el.addEventListener('click', () => { lastNavAt = Date.now(); saveListScroll(); lockNav(); state.blog = null; render(); restoreListScroll(); saveView(); }));
  $app.querySelectorAll('[data-art]').forEach(el => el.addEventListener('click', () => { if (Date.now() - lastNavAt < 600) return; openArticle(el.dataset.art); }));
}
// 記事を開く瞬間に「戻り先の位置」を専用の変数へ記録する。他の処理からは書き換えないので、
// スクロールの惰性などで記録が壊れることがない。戻る時はこの位置へそのまま戻す。
let returnPos = null;
async function openArticle(id, restoreY = null, fromY = null) {
  const meta = state.data.articles.find(a => a.id === id);
  if (!meta) return;
  lastNavAt = Date.now();
  if (fromY != null) scrollMemo[listKey()] = fromY; else saveListScroll();
  returnPos = { key: listKey(), y: scrollMemo[listKey()] || 0 };
  lockNav();
  state.article = { meta, body: null };
  articleScrollY = restoreY || 0;
  saveView();
  state.read.add(id); saveRead();
  renderArticle();
  window.scrollTo(0, 0);
  if (!meta.hasBody) { state.article.body = { posts: [], comments: [], missing: true }; renderArticle(); return; }
  try {
    const res = await fetch('data/articles/' + id + '.json');
    state.article.body = await res.json();
  } catch { state.article.body = { posts: [], comments: [], missing: true }; }
  if (state.article && state.article.meta.id === id) {
    renderArticle();
    if (restoreY) { restoreScrollSticky(restoreY); articleScrollY = restoreY; }
  }
}
function segHTML(s) {
  if (s.img) return '<img loading="lazy" src="' + esc(s.img) + '" alt="" data-view="' + esc(s.img) + '">';
  if (s.br) return '<br>';
  let style = '';
  if (s.color) style += 'color:' + String(s.color).replace(/[^a-zA-Z0-9#(),.% -]/g, '') + ';';
  if (s.size) style += 'font-size:' + s.size + 'px;';
  if (s.bold) style += 'font-weight:bold;';
  const t = esc(s.text || '');
  const inner = style ? '<span style="' + style + '">' + t + '</span>' : t;
  if (s.href) return '<a href="' + esc(s.href) + '" target="_blank" rel="noopener noreferrer">' + inner + '</a>';
  return inner;
}
function renderArticle() {
  const { meta, body } = state.article;
  const b = blogByKey(meta.blogKey);
  const dt = body && body.publishedAt ? body.publishedAt : meta.publishedAt;
  let h = '<div class="articlewrap"><div class="arthead"><button class="back" id="aBack">← 一覧</button><div class="meta">' + esc(b ? b.name : '') + (dt ? ' ・ ' + esc(fmtDT(dt)) : '') + '</div><a class="orig" href="' + esc(meta.url) + '" target="_blank" rel="noopener noreferrer">元記事</a></div><div class="articleinner">';
  h += '<h1 class="atitle">' + esc(meta.title) + '</h1>';
  if (dt) h += '<div class="adate">' + esc(fmtDT(dt)) + '</div>';
  if (!body) h += '<div class="empty">読み込み中…</div>';
  else if (body.missing || !body.posts || !body.posts.length) h += '<div class="empty">この記事の本文データはまだありません。<br><a href="' + esc(meta.url) + '" target="_blank" rel="noopener noreferrer">元記事を開く</a></div>';
  else {
    for (const post of body.posts) h += '<div class="post">' + post.map(segHTML).join('') + '</div>';
    if (body.comments && body.comments.length) {
      h += '<div class="cmtsec"><h2>コメント</h2>';
      for (const c of body.comments) h += '<div class="cmt">' + esc(c) + '</div>';
      h += '</div>';
    }
  }
  h += '<button class="backbtn" id="aBack2">← 一覧に戻る</button></div></div>';
  $app.innerHTML = h;
  const back = () => { lastNavAt = Date.now(); lockNav(); state.article = null; articleScrollY = 0; saveView(); const rp = returnPos; returnPos = null; requestAnimationFrame(() => { render(); if (rp && rp.key === listKey()) restoreScrollSticky(rp.y); else restoreListScroll(); }); };
  document.getElementById('aBack').addEventListener('click', back);
  document.getElementById('aBack2').addEventListener('click', back);
  $app.querySelectorAll('[data-view]').forEach(el => el.addEventListener('click', () => openViewer(el.dataset.view)));
}
/* ---------- image viewer: pinch zoom ---------- */
const viewer = document.getElementById('viewer'), vImg = document.getElementById('vImg'), vStage = document.getElementById('vStage'), vPct = document.getElementById('vPct');
let vz = { scale: 1, x: 0, y: 0 };
const pointers = new Map();
let pinchStart = null, dragStart = null, lastTap = 0;
function applyV() {
  vImg.style.transform = 'translate(' + vz.x + 'px,' + vz.y + 'px) scale(' + vz.scale + ')';
  vPct.textContent = Math.round(vz.scale * 100) + '%';
}
function openViewer(src) {
  vImg.src = src; vz = { scale: 1, x: 0, y: 0 }; applyV();
  viewer.classList.add('open'); viewer.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeViewer() { viewer.classList.remove('open'); viewer.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; pointers.clear(); pinchStart = null; }
document.getElementById('vClose').addEventListener('click', closeViewer);
document.getElementById('vMinus').addEventListener('click', () => { vz.scale = Math.max(1, vz.scale * 0.8); if (vz.scale === 1) { vz.x = 0; vz.y = 0; } applyV(); });
document.getElementById('vPlus').addEventListener('click', () => { vz.scale = Math.min(5, vz.scale * 1.25); applyV(); });
vPct.addEventListener('click', () => { vz = { scale: 1, x: 0, y: 0 }; applyV(); });
vStage.addEventListener('pointerdown', (e) => {
  vStage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    pinchStart = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y), scale: vz.scale, cx: (p1.x + p2.x) / 2, cy: (p1.y + p2.y) / 2, x: vz.x, y: vz.y };
    dragStart = null;
  } else if (pointers.size === 1) {
    dragStart = { x: e.clientX, y: e.clientY, vx: vz.x, vy: vz.y, moved: false };
  }
});
vStage.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinchStart && pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    const ns = Math.min(5, Math.max(1, pinchStart.scale * (d / pinchStart.d)));
    vz.scale = ns;
    vz.x = pinchStart.x + ((p1.x + p2.x) / 2 - pinchStart.cx);
    vz.y = pinchStart.y + ((p1.y + p2.y) / 2 - pinchStart.cy);
    if (ns === 1) { vz.x = 0; vz.y = 0; }
    applyV();
  } else if (dragStart && vz.scale > 1) {
    vz.x = dragStart.vx + (e.clientX - dragStart.x);
    vz.y = dragStart.vy + (e.clientY - dragStart.y);
    if (Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y) > 6) dragStart.moved = true;
    applyV();
  }
});
function endPointer(e) {
  const wasPinch = !!pinchStart;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (pointers.size === 0) {
    if (dragStart && !dragStart.moved && !wasPinch) {
      const now = Date.now();
      if (now - lastTap < 320) { // double tap toggle
        if (vz.scale > 1) vz = { scale: 1, x: 0, y: 0 }; else vz.scale = 2.5;
        applyV(); lastTap = 0;
      } else lastTap = now;
    }
    dragStart = null;
  }
}
vStage.addEventListener('pointerup', endPointer);
vStage.addEventListener('pointercancel', endPointer);
vStage.addEventListener('wheel', (e) => { e.preventDefault(); vz.scale = Math.min(5, Math.max(1, vz.scale * (e.deltaY < 0 ? 1.1 : 0.9))); if (vz.scale === 1) { vz.x = 0; vz.y = 0; } applyV(); }, { passive: false });
document.addEventListener('gesturestart', (e) => { if (viewer.classList.contains('open')) e.preventDefault(); });

/* ---------- boot ---------- */
// 起動時は端末内キャッシュの一覧を即表示し、最新データは裏で取りに行って差し替える。
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch { /* ignore */ } }
(async function boot() {
  $app.innerHTML = '<main><div class="empty">読み込み中…</div></main>';
  let rendered = false;
  try {
    const cache = await caches.open('data-2chmm');
    const hit = await cache.match('data/index.json');
    if (hit) { state.data = await hit.json(); restoreView(); rendered = true; }
  } catch { /* キャッシュが無ければネットワークのみ */ }
  try {
    const res = await fetch('data/index.json', { cache: 'no-cache' });
    try { const cache = await caches.open('data-2chmm'); cache.put('data/index.json', res.clone()); } catch { /* ignore */ }
    const fresh = await res.json();
    if (!rendered) { state.data = fresh; restoreView(); rendered = true; }
    else if (fresh.generatedAt !== state.data.generatedAt && !state.article) {
      const y = window.scrollY;
      state.data = fresh;
      render();
      restoreScrollSticky(y);
    }
  } catch (e) {
    if (!rendered) $app.innerHTML = '<main><div class="empty">データを読み込めませんでした。<br>しばらく待ってから開き直してください。</div></main>';
  }
})();
</script>
</body>
</html>
